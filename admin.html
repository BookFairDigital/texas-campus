
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Texas Campus Admin</title>
<style>
body{font-family:Arial;background:#f1f5fb;color:#10213b;margin:0}
header{background:#071a35;color:white;padding:20px}
main{max-width:1100px;margin:25px auto;padding:15px}
.card{background:white;padding:22px;border-radius:12px;margin-bottom:20px;overflow-x:auto}
input{padding:11px;margin:7px 0;width:95%;border:1px solid #ccd6e4;border-radius:7px}
button{padding:10px 14px;margin:4px;background:#1769ed;color:white;border:0;border-radius:7px;cursor:pointer}
table{border-collapse:collapse;width:100%;min-width:650px}
td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}
.msg{padding:12px;background:#edf3ff;margin:12px 0;overflow-wrap:anywhere}
.hidden{display:none}
</style>
</head>
<body>
<header><b>TEXAS CAMPUS — ADMIN PANEL</b></header>
<main>
<section id="login" class="card">
<h2>Admin Login</h2>
<form id="loginForm">
<input id="email" type="email" placeholder="Admin email" required>
<input id="password" type="password" placeholder="Password" required>
<button type="submit">Sign In</button>
</form>
<div id="loginMsg" class="msg"></div>
</section>

<section id="panel" class="hidden">
<div class="card">
<h2>Admin Dashboard</h2>
<p id="status" class="msg">Checking access...</p>
<button id="refresh">Refresh</button>
<button id="logout">Sign Out</button>
</div>
<div class="card">
<h2>Registered Students</h2>
<table>
<thead><tr><th>Name / Username</th><th>Mobile</th><th>Student ID</th><th>Action</th></tr></thead>
<tbody id="students"></tbody>
</table>
</div>
<div class="card">
<h2>Course Payments</h2>
<table>
<thead><tr><th>Student</th><th>Course ID</th><th>Amount</th><th>Reference</th><th>Status</th><th>Action</th></tr></thead>
<tbody id="orders"></tbody>
</table>
</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db = window.supabase.createClient(
  "https://dykxmozruyzgkiyopvlp.supabase.co",
  "sb_publishable_WprXMzuhLjAKfZfGHvM48A_OHGjmaVH"
);
const $ = id => document.getElementById(id);
const safe = v => String(v ?? "").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

async function checkAdmin(){
  const {data:{user}} = await db.auth.getUser();
  if(!user){$("login").classList.remove("hidden");$("panel").classList.add("hidden");return false}
  const {data,error} = await db.rpc("is_campus_admin");
  if(error || data !== true){
    $("login").classList.remove("hidden");
    $("panel").classList.add("hidden");
    $("loginMsg").textContent="This account is not authorised as an admin.";
    return false;
  }
  $("login").classList.add("hidden");
  $("panel").classList.remove("hidden");
  return true;
}

$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  $("loginMsg").textContent="Signing in...";
  const {error}=await db.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });
  if(error){$("loginMsg").textContent=error.message;return}
  if(await checkAdmin()) await loadData();
});

$("logout").onclick=async()=>{
  await db.auth.signOut();
  await checkAdmin();
};

$("refresh").onclick=loadData;

async function loadData(){
  $("status").textContent="Loading...";
  const [s,o]=await Promise.all([
    db.from("profiles")
      .select("id,full_name,username,mobile,student_id,created_at")
      .order("created_at",{ascending:false}),
    db.from("course_orders")
      .select("id,student_id,course_id,amount,currency,payment_reference,payment_status,course_access")
      .order("created_at",{ascending:false})
  ]);
  if(s.error || o.error){
    $("status").textContent="Error: "+(s.error?.message||o.error?.message);
    return;
  }

  $("students").innerHTML=s.data.map(x=>`
    <tr>
      <td>${safe(x.full_name)}<br>${safe(x.username)}</td>
      <td>${safe(x.mobile||"-")}</td>
      <td>${safe(x.student_id||"Not assigned")}</td>
      <td>${x.student_id?"Assigned":`<button data-assign="${safe(x.id)}">Assign ID</button>`}</td>
    </tr>`).join("") || "<tr><td colspan='4'>No students found.</td></tr>";

  $("orders").innerHTML=o.data.map(x=>`
    <tr>
      <td>${safe(x.student_id)}</td>
      <td>${safe(x.course_id)}</td>
      <td>${safe(x.currency)} ${safe(x.amount)}</td>
      <td>${safe(x.payment_reference||"-")}</td>
      <td>${safe(x.payment_status)} / Access: ${x.course_access?"Yes":"No"}</td>
      <td>${x.payment_status==="pending"?`
        <button data-approve="${safe(x.id)}">Approve</button>
        <button data-reject="${safe(x.id)}">Reject</button>`:"-"}</td>
    </tr>`).join("") || "<tr><td colspan='6'>No orders found.</td></tr>";

  $("status").textContent=`Loaded ${s.data.length} students and ${o.data.length} orders.`;
}

document.addEventListener("click",async e=>{
  const a=e.target.closest("[data-assign]");
  const ok=e.target.closest("[data-approve]");
  const no=e.target.closest("[data-reject]");

  if(a){
    const value=prompt("Enter the Student ID to assign (example: TC-2026-001)");
    if(!value)return;
    const studentId=value.trim().toUpperCase();
    if(!/^[A-Z0-9-]{4,30}$/.test(studentId)){
      alert("Use 4–30 letters, numbers or hyphens.");return;
    }
    const {error}=await db.from("profiles")
      .update({student_id:studentId}).eq("id",a.dataset.assign);
    if(error){alert(error.message);return}
    await loadData();
  }

  if(ok && confirm("Confirm the bank deposit is verified before approving?")){
    const {error}=await db.from("course_orders")
      .update({payment_status:"approved",course_access:true})
      .eq("id",ok.dataset.approve);
    if(error){alert(error.message);return}
    await loadData();
  }

  if(no && confirm("Reject this payment?")){
    const {error}=await db.from("course_orders")
      .update({payment_status:"rejected",course_access:false})
      .eq("id",no.dataset.reject);
    if(error){alert(error.message);return}
    await loadData();
  }
});

(async()=>{if(await checkAdmin())await loadData()})();
</script>
</body>
</html>
